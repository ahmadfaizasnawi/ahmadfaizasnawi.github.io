<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL KEGIATAN SANTRI PPRM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        :root {
            --utama: #2563eb;
            --ungu: #8b5cf6;
            --hijau: #10b981;
            --oranye: #f59e0b;
            --teks: #1e293b;
        }

        body {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: var(--teks);
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 30px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px #2563eb20;
        }

        .header-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: var(--utama);
            font-weight: 800;
        }

        .subtitle {
            color: #64748b;
            margin-top: 8px;
        }

        .section {
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            background: white;
            box-shadow: 0 6px 20px #00000012;
        }

        .section-header {
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
        }

        .harian .section-header {
            background: linear-gradient(90deg, #2563eb, #3b82f6);
        }

        .mingguan .section-header {
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
        }

        .bulanan .section-header {
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        .tahunan .section-header {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .section-body {
            padding: 20px;
        }

        .item {
            padding: 18px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f8fafc;
            border-left: 4px solid;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .item:last-child { margin-bottom: 0; }

        .item:hover {
            transform: translateX(8px);
            background: #eef2ff;
        }

        .harian .item { border-color: #2563eb; }
        .mingguan .item { border-color: #8b5cf6; }
        .bulanan .item { border-color: #10b981; }
        .tahunan .item { border-color: #f59e0b; }

        .item-label {
            font-weight: bold;
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        /* POPUP HALAMAN KOSONG — DIPERBESAR */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.5);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            height: 85vh;
            max-height: 850px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: var(--utama);
            color: white;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 1.3rem; }

        .tutup-x {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .tutup-x:hover { transform: rotate(90deg); }

        .modal-body {
            padding: 30px;
            flex-grow: 1;
            background: white;
        }

        .modal-footer {
            padding: 18px 30px;
            border-top: 1px solid #e2e8f0;
            text-align: right;
        }

        .btn-tutup {
            background: var(--utama);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 32px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-tutup:hover { background: #1d4ed8; }

        @media (max-width: 600px) {
            body { padding: 12px; }
            h1 { font-size: 1.5rem; }
            .section-header { font-size: 1.1rem; }
            .modal-content { height: 90vh; }
            .modal-body { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <img src="https://i.postimg.cc/ZRjt64B4/images.jpg" alt="PPRM" class="header-img">
        <h1>PORTAL KEGIATAN SANTRI PPRM</h1>
        <p class="subtitle">✨ Sumber Informasi Kegiatan Santri</p>
    </header>

    <!-- HARIAN -->
    <section class="section harian">
        <div class="section-header">📅 Harian</div>
        <div class="section-body">
            <div class="item" data-judul="📚 SMP — Kegiatan Harian">
                <div class="item-label">📚 SMP</div>
            </div>
            <div class="item" data-judul="📖 MA — Kegiatan Harian">
                <div class="item-label">📖 MA</div>
            </div>
            <div class="item" data-judul="🎓 KULIAH — Kegiatan Harian">
                <div class="item-label">🎓 KULIAH</div>
            </div>
            <div class="item" data-judul="🛠️ KHIDMAH — Kegiatan Harian">
                <div class="item-label">🛠️ KHIDMAH</div>
            </div>
        </div>
    </section>

    <!-- MINGGUAN -->
    <section class="section mingguan">
        <div class="section-header">🗓️ Mingguan</div>
        <div class="section-body">
            <div class="item" data-judul="📚 SMP — Kegiatan Mingguan">
                <div class="item-label">📚 SMP</div>
            </div>
            <div class="item" data-judul="📖 MA — Kegiatan Mingguan">
                <div class="item-label">📖 MA</div>
            </div>
            <div class="item" data-judul="🎓 KULIAH — Kegiatan Mingguan">
                <div class="item-label">🎓 KULIAH</div>
            </div>
            <div class="item" data-judul="🛠️ KHIDMAH — Kegiatan Mingguan">
                <div class="item-label">🛠️ KHIDMAH</div>
            </div>
        </div>
    </section>

    <!-- BULANAN -->
    <section class="section bulanan">
        <div class="section-header">📆 Bulanan</div>
        <div class="section-body">
            <div class="item" data-judul="📚 SMP — Kegiatan Bulanan">
                <div class="item-label">📚 SMP</div>
            </div>
            <div class="item" data-judul="📖 MA — Kegiatan Bulanan">
                <div class="item-label">📖 MA</div>
            </div>
            <div class="item" data-judul="🎓 KULIAH — Kegiatan Bulanan">
                <div class="item-label">🎓 KULIAH</div>
            </div>
            <div class="item" data-judul="🛠️ KHIDMAH — Kegiatan Bulanan">
                <div class="item-label">🛠️ KHIDMAH</div>
            </div>
        </div>
    </section>

    <!-- TAHUNAN -->
    <section class="section tahunan">
        <div class="section-header">🗓️ Tahunan</div>
        <div class="section-body">
            <div class="item" data-judul="📚 SMP — Kegiatan Tahunan">
                <div class="item-label">📚 SMP</div>
            </div>
            <div class="item" data-judul="📖 MA — Kegiatan Tahunan">
                <div class="item-label">📖 MA</div>
            </div>
            <div class="item" data-judul="🎓 KULIAH — Kegiatan Tahunan">
                <div class="item-label">🎓 KULIAH</div>
            </div>
            <div class="item" data-judul="🛠️ KHIDMAH — Kegiatan Tahunan">
                <div class="item-label">🛠️ KHIDMAH</div>
            </div>
        </div>
    </section>

    <footer>© 2026 PORTAL KEGIATAN SANTRI PPRM</footer>
</div>

<!-- POPUP HALAMAN KOSONG YANG BESAR -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="judulModal">Judul</h2>
            <button class="tutup-x" id="tombolTutup">&times;</button>
        </div>
        <div class="modal-body">
            <!-- KOTAK TULISAN DIHAPUS — TINGGAL HALAMAN PUTIH KOSONG -->
        </div>
        <div class="modal-footer">
            <button class="btn-tutup" id="tombolTutupBawah">Tutup</button>
        </div>
    </div>
</div>

<script>
const modal = document.getElementById('modal');
const judulModal = document.getElementById('judulModal');

// Buka halaman kosong saat diklik
document.querySelectorAll('.item').forEach(item => {
    item.addEventListener('click', () => {
        judulModal.textContent = item.dataset.judul;
        modal.classList.add('active');
    });
});

// Tutup
function tutupModal() {
    modal.classList.remove('active');
}

document.getElementById('tombolTutup').addEventListener('click', tutupModal);
document.getElementById('tombolTutupBawah').addEventListener('click', tutupModal);
modal.addEventListener('click', e => {
    if (e.target === modal) tutupModal();
});
</script>
</body>
</html>
